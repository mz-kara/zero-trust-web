name: CD pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS credentials
        uses: aws-actions/configurate-aws-credentials@v4
        with:
          rote-to-assume: arn:aws:iam::594161137006:role/oidc-github-role
          aws-region: "eu-west-3"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format Terraform
        run: terraform fmt -check -recursive

      - name: Init Terraform
        run: terraform init

      - name: Validate Terraform code
        run: terraform init

      - name: Plan Terraform
        run: terraform plan
      
      - name: Apply Terraform 
        run: terraform apply

      

