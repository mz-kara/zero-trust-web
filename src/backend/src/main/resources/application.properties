# ===========================================================================
# Configuration du backend
# ===========================================================================
# Port sur lequel tourne le backend
server.port=8080

# ---------------------------------------------------------------------------
# Identifiants autorises
# ---------------------------------------------------------------------------
# IMPORTANT (securite) :
#   - En local, on met des valeurs par defaut ci-dessous pour pouvoir tester.
#   - Ces valeurs peuvent etre REMPLACEES par des variables d'environnement,
#     ce qui est exactement ce qu'on fera sur AWS : les vraies valeurs
#     viendront de Secrets Manager, injectees comme variables d'environnement,
#     et ne seront donc jamais ecrites dans le code.
#
# La syntaxe ${VARIABLE:valeur_par_defaut} veut dire :
#   "utilise la variable d'environnement VARIABLE si elle existe,
#    sinon utilise la valeur par defaut".
#
# Identifiant par defaut : admin
# Mot de passe par defaut : motdepasse123
# (le hash ci-dessous correspond a 'motdepasse123')
# ---------------------------------------------------------------------------

app.auth.username=${APP_AUTH_USERNAME:admin}
app.auth.password-hash=${APP_AUTH_PASSWORD_HASH:$2b$10$IznbTjYdhUb7MLfy9XJhTunDkNt6Ia96RblEhsCb9GxW.ReD/yv.O}
