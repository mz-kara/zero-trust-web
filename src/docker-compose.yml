services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coffre
      POSTGRES_PASSWORD: coffre
      POSTGRES_DB: coffre
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: coffre
      DB_PASSWORD: coffre
      DB_NAME: coffre
      JWT_SECRET: dev-secret-change-me
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
